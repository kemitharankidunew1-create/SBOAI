
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBOAI Kingdom</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial, sans-serif;
background:#000;
color:#fff;
overflow-x:hidden;
text-align:center;
}

/* INTRO */
#intro{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#220000,#000);
}

#lion{
font-size:120px;
animation:roar 2s infinite;
filter:drop-shadow(0 0 20px gold);
}

@keyframes roar{
0%{transform:scale(1) rotate(0deg);}
25%{transform:scale(1.1) rotate(-3deg);}
50%{transform:scale(1.2) rotate(3deg);}
75%{transform:scale(1.1);}
100%{transform:scale(1);}
}

#title{
font-size:55px;
font-weight:bold;
color:gold;
margin-top:20px;
letter-spacing:6px;
text-shadow:0 0 20px gold;
}

#subtitle{
margin-top:15px;
font-size:22px;
color:#ddd;
}

.enter-btn{
margin-top:40px;
padding:18px 40px;
font-size:22px;
border:none;
border-radius:14px;
background:gold;
color:#000;
font-weight:bold;
cursor:pointer;
}

/* MAIN SITE */
#main{
display:none;
padding:80px 20px;
background:#0b0b0b;
min-height:100vh;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:50px;
}

.card{
width:260px;
padding:25px;
background:#1a1a1a;
border-radius:18px;
box-shadow:0 0 20px rgba(255,215,0,.1);
}

h2{color:gold;font-size:42px;}
</style>
</head>

<body>

<section id="intro">
<div id="lion">🦁⚔️</div>
<div id="title">SBOAI</div>
<div id="subtitle">The Kingdom of Sri Lankan AI</div>
<button class="enter-btn" onclick="enterSite()">Enter Kingdom</button>
</section>

<section id="main">
<h2>Sri Lanka's Premium AI</h2>
<p style="margin-top:20px;font-size:22px;">Luxury Intelligence for Chat, Study, Business & Success.</p>

<div class="cards">
<div class="card">
<h3>Chat AI</h3>
<p>Ask anything instantly.</p>
</div>

<div class="card">
<h3>Student AI</h3>
<p>Homework, Notes, O/L & A/L support.</p>
</div>

<div class="card">
<h3>Business AI</h3>
<p>Ads, Captions & Growth tools.</p>
</div>
</div>
</section>

<script>
function enterSite(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
}
</script>

</body>
</html>
