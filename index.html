<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBOAI Premium AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff;text-align:center}
#intro{
height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
background:radial-gradient(circle,#2a0000,#000)
}
#lion{font-size:110px;animation:pulse 1.8s infinite}
@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.15)}
100%{transform:scale(1)}
}
h1{font-size:60px;color:gold;letter-spacing:6px}
button{
padding:15px 30px;margin-top:25px;border:none;border-radius:12px;
background:gold;color:#000;font-weight:bold;font-size:20px;cursor:pointer
}
#app{display:none;padding:40px}
#chatbox{
max-width:700px;margin:auto;background:#111;padding:20px;border-radius:18px
}
#messages{
height:350px;overflow:auto;text-align:left;padding:10px;background:#1a1a1a;border-radius:12px
}
.msg{margin:10px 0;padding:10px;border-radius:10px}
.user{background:#333}
.ai{background:#222;color:#ffd700}
input{
width:75%;padding:14px;border:none;border-radius:10px;margin-top:15px
}
.send{padding:14px 22px;margin-left:8px}
</style>
</head>
<body>

<section id="intro">
<div id="lion">🦁⚔️</div>
<h1>SBOAI</h1>
<p>Sri Lanka's Premium AI Kingdom</p>
<button onclick="enterSite()">ENTER</button>
</section>

<section id="app">
<h1 style="font-size:42px">SBOAI Chat</h1>
<div id="chatbox">
<div id="messages"></div>
<input id="prompt" placeholder="Ask anything...">
<button class="send" onclick="sendMsg()">Send</button>
</div>
</section>

<script>
function enterSite(){
document.getElementById("intro").style.display="none";
document.getElementById("app").style.display="block";
}

async function sendMsg(){
let input=document.getElementById("prompt");
let text=input.value.trim();
if(!text)return;

let box=document.getElementById("messages");
box.innerHTML += `<div class='msg user'>${text}</div>`;
input.value="";

box.innerHTML += `<div class='msg ai'>Thinking...</div>`;
box.scrollTop=box.scrollHeight;

setTimeout(()=>{
box.lastChild.innerHTML="SBOAI AI reply: " + text;
box.scrollTop=box.scrollHeight;
},1000);
}
</script>

</body>
</html>
